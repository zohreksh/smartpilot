name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/seo-pages-foundation"
      - "feature/beauty-fashion-demo-scope"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-visual-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NUXT_PUBLIC_SITE_URL: https://smartpilot.ir

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test GeoIP decision logic
        run: node --test tests/geo-language.test.mjs

      - name: Validate English image assets
        run: node scripts/english-images-qa.mjs

      - name: Build
        run: npm run build

      - name: Generate static output
        run: npm run generate

      - name: Verify generated routes
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            .output/public/index.html \\
            .output/public/demo/index.html \
            .output/public/en/index.html \\
            .output/public/en/demo/index.html \
            .output/public/en/services/index.html \
            .output/public/en/services/ai-development/index.html \
            .output/public/en/services/ecommerce-development/index.html \
            .output/public/en/projects/index.html \
            .output/public/en/projects/shidaneh/index.html \
            .output/public/en/projects/hevix/index.html \
            .output/public/en/about/index.html \
            .output/public/en/contact/index.html \
            .output/public/en/privacy/index.html \
            .output/public/services/index.html \
            .output/public/services/ai-development/index.html \
            .output/public/services/ecommerce-development/index.html \
            .output/public/projects/index.html \
            .output/public/projects/shidaneh/index.html \
            .output/public/projects/hevix/index.html \
            .output/public/about/index.html \
            .output/public/contact/index.html \
            .output/public/privacy/index.html \
            .output/public/en/privacy/index.html \
            .output/public/robots.txt \
            .output/public/sitemap.xml
          do
            test -f "$file"
          done

      - name: Run SEO QA
        run: node scripts/seo-qa.mjs

      - name: Start generated site
        shell: bash
        run: |
          python3 -m http.server 4173 --directory .output/public >/tmp/smartpilot-http.log 2>&1 &
          echo $! > /tmp/smartpilot-http.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/smartpilot-http.log
          exit 1

      - name: Smoke check routes
        shell: bash
        run: |
          set -euo pipefail
          for route in \
            / \
            /en/ \
            /en/services/ \
            /en/services/ai-development/ \
            /en/services/ecommerce-development/ \
            /en/projects/ \
            /en/projects/shidaneh/ \
            /en/projects/hevix/ \
            /en/about/ \
            /en/contact/ \
            /en/privacy/ \
            /services/ \
            /services/ai-development/ \
            /services/ecommerce-development/ \
            /projects/ \
            /projects/shidaneh/ \
            /projects/hevix/ \
            /about/ \
            /contact/ \
            /privacy/ \
            /en/privacy/ \
            /robots.txt \
            /sitemap.xml
          do
            curl --fail --silent --show-error "http://127.0.0.1:4173$route" >/dev/null
          done

      - name: Install browser QA dependency
        shell: bash
        run: |
          mkdir -p /tmp/smartpilot-playwright-qa
          cd /tmp/smartpilot-playwright-qa
          npm init -y
          npm install playwright@1.55.0
          ln -s /tmp/smartpilot-playwright-qa/node_modules/playwright "$GITHUB_WORKSPACE/node_modules/playwright"

      - name: Install Chromium
        run: /tmp/smartpilot-playwright-qa/node_modules/.bin/playwright install --with-deps chromium

      - name: Run responsive browser QA
        env:
          QA_BASE_URL: http://127.0.0.1:4173
        run: node scripts/responsive-qa.mjs

      - name: Run GeoIP browser scenarios
        env:
          QA_BASE_URL: http://127.0.0.1:4173
        run: node scripts/geo-language-qa.mjs

      - name: Upload responsive QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-qa
          path: qa-artifacts
          if-no-files-found: warn
