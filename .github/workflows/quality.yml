name: Quality Gate

on:
  push:
    branches:
      - feature/homepage-redesign
  pull_request:

permissions:
  contents: read

jobs:
  build-and-visual-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NUXT_PUBLIC_SITE_URL: https://nexastudio.example.invalid

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Generate static output
        run: npm run generate

      - name: Verify generated routes
        shell: bash
        run: |
          set -euo pipefail
          for file in             .output/public/index.html             .output/public/services/index.html             .output/public/projects/index.html             .output/public/about/index.html             .output/public/contact/index.html             .output/public/robots.txt             .output/public/sitemap.xml
          do
            test -f "$file"
          done

      - name: Start generated site
        shell: bash
        run: |
          python3 -m http.server 4173 --directory .output/public >/tmp/nexa-http.log 2>&1 &
          echo $! > /tmp/nexa-http.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nexa-http.log
          exit 1

      - name: Smoke check routes
        shell: bash
        run: |
          set -euo pipefail
          for route in / /services/ /projects/ /about/ /contact/ /robots.txt /sitemap.xml; do
            curl --fail --silent --show-error "http://127.0.0.1:4173$route" >/dev/null
          done

      - name: Install browser QA dependency
        run: npm install --no-save --package-lock=false playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run responsive browser QA
        env:
          QA_BASE_URL: http://127.0.0.1:4173
        run: node scripts/responsive-qa.mjs

      - name: Upload responsive QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-qa
          path: qa-artifacts
          if-no-files-found: warn
